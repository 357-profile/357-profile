<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}img{max-width:100%}</style></head><body><title>Complete Workout Plan</title>

<style>
/* Layout: page tabs on top, then day tabs and a grid of animated move cards; a card opens a full-screen view with the log. Single light pink look by choice. */
:root {
  --bg: #fff8fa;
  --surface: #ffffff;
  --blush: #fdeaf1;
  --rose: #e2557f;
  --rose-ink: #b42f59;
  --plum: #3f1d36;
  --muted: #8a6b7b;
  --line: #f3d6e1;
  --muscle: #ff1f56;
  --ok: #2f9e6e;
  --font: "Tajawal", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--plum); }
body { font-family: var(--font); font-size: 16px; line-height: 1.6; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 56px; }
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 18px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; line-height: 1.3; font-weight: 800; }
button, input { font-family: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }

header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 6px 16px; }
h1 { font-size: clamp(24px, 4.6vw, 34px); }
.wk { font-size: 14px; color: var(--rose-ink); font-weight: 700; background: var(--blush); border-radius: 999px; padding: 3px 12px; }

.pages { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 5px; }
@media (max-width: 560px) { .pages { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.pg { border: 0; background: transparent; border-radius: 12px; padding: 9px 4px; font-weight: 700; font-size: 15px; cursor: pointer; color: var(--muted); }
.pg[aria-pressed="true"] { background: var(--rose); color: #fff; }

.days { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 640px) { .days { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.day { position: relative; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 9px 12px; text-align: start; display: grid; cursor: pointer; min-width: 0; }
.day .n { font-size: 12.5px; color: var(--muted); }
.day .t { font-weight: 800; font-size: 15px; line-height: 1.35; }
.day[aria-pressed="true"] { border-color: var(--rose); background: var(--blush); }
.day .done { position: absolute; top: 8px; inset-inline-end: 10px; width: 20px; height: 20px; border-radius: 50%; background: var(--ok); color: #fff; font-size: 12px; display: grid; place-items: center; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 14px; }
button.chip { cursor: pointer; color: var(--rose-ink); font-weight: 700; }
.chip.eat { background: var(--rose); border-color: var(--rose); color: #fff; font-weight: 700; }
.lead { margin: 0; color: var(--muted); font-size: 15px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 12px; }
.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: grid; grid-template-rows: auto 1fr; min-width: 0; cursor: pointer; text-align: start; padding: 0; }
.card.is-done { border-color: var(--ok); }
.thumb { position: relative; background: linear-gradient(180deg, #fff3f7, #fbdde8); aspect-ratio: 250 / 165; }
.thumb canvas { width: 100%; height: 100%; display: block; }
.num { position: absolute; top: 9px; inset-inline-start: 12px; font-weight: 800; font-size: 14px; color: var(--rose-ink); }
.check { position: absolute; top: 8px; inset-inline-end: 8px; width: 34px; height: 34px; border-radius: 50%; border: 2px solid #e8bfd0; background: rgba(255,255,255,.9); display: grid; place-items: center; cursor: pointer; color: transparent; font-weight: 800; font-size: 16px; }
.check[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.cbody { padding: 10px 14px 12px; display: grid; gap: 2px; min-width: 0; }
.cbody h4 { font-size: 17px; }
.lift { font-weight: 800; color: var(--rose-ink); font-size: 16px; }
.sub { font-size: 13.5px; color: var(--muted); }

/* modal */
.modal { position: fixed; inset: 0; z-index: 30; background: rgba(63,29,54,.38); display: grid; place-items: center; padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.sheet { background: var(--surface); border-radius: 24px; width: min(760px, 100%); max-height: 100%; overflow: auto; display: grid; }
.stage { position: relative; background: linear-gradient(180deg, #fff1f6, #f9d3e1); aspect-ratio: 250 / 170; }
.stage canvas { width: 100%; height: 100%; display: block; }
.x { position: absolute; top: 10px; inset-inline-start: 10px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); font-size: 20px; cursor: pointer; }
.speed { position: absolute; top: 10px; inset-inline-end: 10px; border: 0; background: rgba(255,255,255,.92); border-radius: 999px; padding: 7px 14px; font-weight: 700; cursor: pointer; font-size: 14px; }
.speed[aria-pressed="true"] { background: var(--plum); color: #fff; }
.mbody { padding: 16px 18px 20px; display: grid; gap: 14px; }
.mtop { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.mtop h2 { font-size: 22px; }
.mtop .en { font-size: 12px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
.big { font-size: 22px; font-weight: 800; color: var(--rose-ink); }
.maps { display: flex; gap: 10px; align-items: start; flex: none; }
.maps figure { margin: 0; display: grid; justify-items: center; gap: 0; }
.maps svg { width: 52px; height: auto; }
.maps figcaption { font-size: 11.5px; color: var(--muted); }
.mchip { font-size: 13px; padding: 1px 10px; border-radius: 999px; background: #ffe3ea; color: #c4123f; font-weight: 500; }
.tip { margin: 0; font-size: 14.5px; border-inline-start: 3px solid var(--rose); padding: 1px 10px; }
.logrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--bg); border-radius: 14px; padding: 10px 12px; }
.logrow label { font-weight: 700; font-size: 15px; }
.logrow input { width: 90px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 16px; background: var(--surface); }
.btn { border: 0; border-radius: 999px; padding: 9px 18px; font-weight: 800; font-size: 15px; cursor: pointer; background: var(--rose); color: #fff; }
.btn.ghost { background: var(--surface); color: var(--plum); border: 1px solid var(--line); }
.btn.okd { background: var(--ok); }
.hist { display: flex; flex-wrap: wrap; gap: 6px; }
.hist span { font-size: 13px; background: var(--blush); border-radius: 8px; padding: 2px 8px; }
.saved { font-size: 13px; color: var(--ok); font-weight: 700; }

/* log page */
.week { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.wd { border: 1px solid var(--line); border-radius: 14px; padding: 10px; text-align: center; background: var(--surface); }
.wd.ok { border-color: var(--ok); background: #eaf7f0; }
.wd b { display: block; font-size: 22px; }
.stepper { display: inline-flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.stepper button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--blush); font-size: 18px; font-weight: 800; cursor: pointer; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { padding: 10px 12px; text-align: start; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 13px; color: var(--muted); font-weight: 500; }
td.go { color: var(--rose-ink); font-weight: 800; }
tr:last-child td { border-bottom: 0; }
tbody tr { cursor: pointer; }
.note { font-size: 13.5px; color: var(--muted); margin: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

// ---- Skeleton engine: side-view mannequin driven by segment angles (deg, 0 = right, 90 = down) ----
const SEG = { T: 48, UA: 27, FA: 25, TH: 40, SH: 38, FT: 11, NECK: 16 };
const R = { hip: 9, sh: 8, head: 9, limb: 4.5 };
function dir(a) { const r = a * Math.PI / 180; return [Math.cos(r), Math.sin(r)]; }

  const leg = (l) => [l[0], l[1], l[2] ?? (l[1] - 90), l[3] ?? 1];
  const arm = (a) => [a[0], a[1], a[2] ?? 1];
  return { t: p.t, h: p.h ?? p.t, an: arm(p.an), af: arm(p.af), ln: leg(p.ln), lf: leg(p.lf) };
}
function lerpPose(A, B, k) {
  const l = (a, b) => a + (b - a) * k;
  const la = (x, y) => x.map((v, i) => l(v, y[i]));
  return { t: l(A.t, B.t), h: l(A.h, B.h), an: la(A.an, B.an), af: la(A.af, B.af), ln: la(A.ln, B.ln), lf: la(A.lf, B.lf) };
}
function solve(p) {
  const hip = [0, 0];
  const d = dir(p.t);
  const sh = add(hip, d, SEG.T);
  const head = add(sh, dir(p.h), SEG.NECK);
  const arm = (a) => { const e = add(sh, dir(a[0]), SEG.UA * a[2]); const w = add(e, dir(a[1]), SEG.FA * a[2]); return { s: sh, e, w, a }; };
  const leg = (l) => { const k = add(hip, dir(l[0]), SEG.TH * l[3]); const an = add(k, dir(l[1]), SEG.SH * l[3]); const toe = add(an, dir(l[2]), SEG.FT); return { h: hip, k, an, toe, l }; };
  const S = { hip, sh, head, d, hd: dir(p.h), front: [-d[1], d[0]], an: arm(p.an), af: arm(p.af), ln: leg(p.ln), lf: leg(p.lf) };
  S.pt = { hip, sh, head, wN: S.an.w, wF: S.af.w, eN: S.an.e, kN: S.ln.k, kF: S.lf.k, anN: S.ln.an, anF: S.lf.an, toeN: S.ln.toe, toeF: S.lf.toe };

}

function drawScene(ctx, W, H, id, t, opts = {}) {
  const P = prep(id);
  const [x0, y0, x1, y1] = P.box;
  const bw = x1 - x0, bh = y1 - y0;

  seg(ctx, [cx, shY], [cx, headY + 6], 7, COL.skin, COL.skinEdge);
  ctx.fillStyle = COL.skinEdge; ctx.beginPath(); ctx.arc(cx, headY, 10.6, 0, 7); ctx.fill();
  ctx.fillStyle = COL.skin; ctx.beginPath(); ctx.arc(cx, headY, 9.8, 0, 7); ctx.fill();
  ctx.fillStyle = COL.hair; ctx.beginPath(); ctx.arc(cx, headY, 10.4, Math.PI * 1.05, Math.PI * 1.95); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(cx, headY - 12, 4.5, 0, 7); ctx.fill();

const ALT = { chestpress: 'pecdeck', pecdeck: 'chestpress', goblet: 'smithsquat', smithsquat: 'goblet', legcurl: 'seatedcurl', seatedcurl: 'legcurl', abduction: 'sidelift', legraise: 'crunch', cablecrunch: 'crunch', bulgarian: 'lunge', kickback: 'donkey', hipthrust: 'bridge' };
const PROGRAM = new Set(DAYS.flatMap(d => d.list));

// ---------- helpers ----------
const $ = (id) => document.getElementById(id);
const ar = (n) => String(n).replace(/\./g, '٫').replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const iso = (d) => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); };
const today = () => iso(new Date());
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);

// ---------- state (saved per person) ----------

let store = null, ref = null, saving = Promise.resolve();

  try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}

}
(async () => {
  try {

    if (!db || !user) return;

    ref.onSnapshot(snap => {
      if (snap.exists) { const d = snap.data(); S = { start: d.start || null, log: d.log || {}, done: d.done || {} }; try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} render(); refreshModal(); }

})();

function ensureStart() { if (!S.start) S.start = today(); }

  else (S.done[t] = S.done[t] || []).push(id);

}

// ---------- what to lift ----------
function sets(id) { const e = EX[id]; if (e.cardio || e.q) return ''; return `${ar(stage() ? 3 : 2)} × ${(e.r || ['١٠', '١٢', '١٢'])[stage()]}`; }
function lift(id, st = stage()) {

// ---------- views ----------
let page = 'plan', day = 0;
try { const p = localStorage.getItem('gym-page'); if (p) page = p; const d = +localStorage.getItem('gym-day2'); if (d >= 0 && d < 4) day = d; } catch (e) {}
if (!['plan', 'cardio', 'pilates', 'warm', 'stretch', 'log'].includes(page)) page = 'plan';

function setWeek(n) { n = Math.max(1, Math.min(52, n)); const d = new Date(today() + 'T12:00:00'); d.setDate(d.getDate() - (n - 1) * 7); S.start = iso(d); save(); render(); }

// ---------- modal ----------
let mId = null, slow = false, lastFocus = null, savedMsg = '';

  if (inProg) h += `<div class="chips"><button class="btn${isDone(id) ? ' okd' : ''}" id="mDone">${isDone(id) ? '✓ خلّصته هالأسبوع' : 'خلّصته'}</button>${ALT[id] ? `<button class="btn ghost" id="mAlt">الجهاز مشغول؟ ${EX[ALT[id]].ar}</button>` : ''}</div>`;
  else if (ALT[id]) h += `<div class="chips"><button class="btn ghost" id="mAlt">بديله: ${EX[ALT[id]].ar}</button></div>`;
  $('mBody').innerHTML = h;
  const sv = $('mSave');
  if (sv) sv.onclick = () => {
    const v = parseFloat(String($('mKg').value).replace('٫', '.').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)));
    if (!(v > 0)) { $('mSaved').textContent = 'اكتبي الوزن بالأرقام'; return; }
    ensureStart();
    const arr = S.log[id] = S.log[id] || [];
    const t = today(); const ex = arr.findIndex(x => x[0] === t); if (ex >= 0) arr.splice(ex, 1);
    arr.push([t, v]); if (arr.length > 40) arr.splice(0, arr.length - 40);
    savedMsg = 'انحفظ ✓'; save(); refreshModal(); render();
  };
  const dn = $('mDone'); if (dn) dn.onclick = () => toggleDone(id);
  const al = $('mAlt'); if (al) al.onclick = () => openModal(ALT[id]);
}

// ---------- animation ----------
let cvs = [];
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(en => { const c = cvs.find(x => x.el === en.target); if (c) c.vis = en.isIntersecting; }), { rootMargin: '200px' }) : null;
function collect() {
  if (io) io.disconnect();
  cvs = [...document.querySelectorAll('#view canvas[data-id]')].map(el => ({ el, id: el.dataset.id, vis: true }));
  sizeAll();
  if (io) cvs.forEach(c => io.observe(c.el));
}
function fit(el) { const dpr = Math.min(window.devicePixelRatio || 1, 2); const r = el.getBoundingClientRect(); el.width = Math.max(1, Math.round(r.width * dpr)); el.height = Math.max(1, Math.round(r.height * dpr)); }
function sizeAll() { cvs.forEach(c => fit(c.el)); if (mId) fit($('mCv')); }
window.addEventListener('resize', sizeAll);
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
let mt = 0, lastNow = 0;
function frame(now) {
  const dt = now - lastNow; lastNow = now;
  const t = reduce ? 700 : now;
  if (mId) { mt += reduce ? 0 : dt * (slow ? 0.4 : 1); const c = $('mCv'); drawScene(c.getContext('2d'), c.width, c.height, mId, reduce ? 700 : mt); }
  else for (const c of cvs) if (c.vis) drawScene(c.el.getContext('2d'), c.el.width, c.el.height, c.id, t);
  requestAnimationFrame(frame);
}
render();
requestAnimationFrame(frame);
</script>
</body></html>
